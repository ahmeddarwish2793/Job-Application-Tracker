<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Job Applications Tracker</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>

<body class="center-page">

<div class="card reset-card">

    <div class="login-logo">
        <i class="fa-solid fa-key"></i>
    </div>

    <h2 class="login-title text-center">Reset Your Password</h2>
    <p class="login-subtitle text-center">
        Enter your new password below
    </p>

    <form id="resetForm">

        <label>New Password</label>
        <div class="password-container">
            <input
                    type="password"
                    id="newPassword"
                    class="input-field"
                    placeholder="••••••••"
            />
            <i class="fa-solid fa-eye-slash toggle-password"
               id="toggleNewPassword"></i>
        </div>
        <small class="error-message" id="newPasswordError"></small>

        <label>Confirm Password</label>
        <div class="password-container">
            <input
                    type="password"
                    id="confirmPassword"
                    class="input-field"
                    placeholder="••••••••"
            />
            <i class="fa-solid fa-eye-slash toggle-password"
               id="toggleConfirmPassword"></i>
        </div>
        <small class="error-message" id="confirmPasswordError"></small>

        <button type="submit" class="button-primary">
            Reset Password
        </button>

        <p class="signup-text">
            Remembered your password?
            <a href="login.html" class="signup-link">Back to Login</a>
        </p>

    </form>

</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="resetPasswordToast"
         class="toast align-items-center text-bg-success border-0"
         role="alert">
        <div class="d-flex">
            <div class="toast-body" id="resetPasswordToastMessage">
                Password updated successfully!
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>
    </div>
</div>

<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/reset-password.js"></script>

<script src="../js/reset-password.js"></script>
</body>
</html>
